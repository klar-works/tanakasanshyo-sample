<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセス・お問い合わせ | 田中産商 有限会社</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="page-under">
    <header class="global-header solid-header">
        <div class="logo">TANAKA SANSHO</div>
        <nav class="global-nav">
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="about.html">組織概要</a></li>
                <li><a href="products.html">製品情報</a></li>
                <li><a href="contact.html">アクセス・お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-main">
        <section class="section-container">
            <div class="section-inner">
                <div class="section-title-horizontal js-fade">
                    <h2>アクセス・お問い合わせ</h2>
                    <span class="en-title">Access & Contact</span>
                </div>

                <div class="layout-split js-fade delay-1">
                    <!-- 左側：情報とマップ -->
                    <div class="contact-info">
                        <div class="company-details">
                            <p class="company-name">田中産商 有限会社</p>
                            <p class="company-address">
                                〒351-0007<br>
                                埼玉県朝霞市岡3-29-23<br><br>
                                <strong>TEL:</strong> 048-461-0130<br>
                                <strong>FAX:</strong> 048-461-0126
                            </p>
                        </div>
                        
                        <div class="access-map">
                            <div class="map-placeholder">
                                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3235.158652150172!2d139.5851412!3d35.8115682!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6018ea1b0b5cc4ab%3A0x6b44558509c15b13!2z44CSMzUxLTAwMDcg5Z-8546J55yM5pyd6Z6e5biC5bKh77yT5LiB55uu77yS77yZ4oiS77yS77yT!5e0!3m2!1sja!2sjp!4v1690000000000!5m2!1sja!2sjp" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                            </div>
                        </div>
                    </div>

                    <!-- 右側：お問い合わせフォーム -->
                    <div class="contact-form-wrapper">
                        <p class="form-lead">製品の加工依頼や試作のご相談など、お気軽にお問い合わせください。</p>
                        <form action="#" class="modern-form">
                            <div class="form-group">
                                <label for="company">貴社名</label>
                                <input type="text" id="company" class="form-control" placeholder="例：株式会社〇〇">
                            </div>
                            <div class="form-group">
                                <label for="name">お名前 <span class="req">必須</span></label>
                                <input type="text" id="name" class="form-control" required placeholder="例：田中 太郎">
                            </div>
                            <div class="form-group">
                                <label for="email">メールアドレス <span class="req">必須</span></label>
                                <input type="email" id="email" class="form-control" required placeholder="例：info@example.com">
                            </div>
                            <div class="form-group">
                                <label for="phone">電話番号</label>
                                <input type="tel" id="phone" class="form-control" placeholder="例：03-1234-5678">
                            </div>
                            <div class="form-group">
                                <label for="message">お問い合わせ内容 <span class="req">必須</span></label>
                                <textarea id="message" class="form-control" rows="5" required placeholder="ご質問やご依頼内容をご記入ください"></textarea>
                            </div>
                            <button type="submit" class="submit-btn">送信する <span class="btn-line"></span></button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="global-footer">
        <p>&copy; 2026 TANAKA SANSHO CO., LTD. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
